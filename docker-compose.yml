name: contexta

x-restart: &restart
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    <<: *restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-contexta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-contexta}
      POSTGRES_DB: ${POSTGRES_DB:-contexta}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-contexta} -d ${POSTGRES_DB:-contexta}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [contexta]

  redis:
    image: redis:7-alpine
    <<: *restart
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [contexta]

  qdrant:
    image: qdrant/qdrant:v1.12.4
    <<: *restart
    environment:
      QDRANT__API__KEY: ${QDRANT_API_KEY:-}
      QDRANT__SERVICE__GRPC_PORT: 6334
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrantdata:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [contexta]

  minio:
    image: rustfs/rustfs:latest
    <<: *restart
    # S3-compatible object storage. RustFS exposes the MinIO/S3 API, so the
    # application code is unchanged; only this image reference differs.
    command: ["/data"]
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ACCESS_KEY:-contexta}
      RUSTFS_SECRET_KEY: ${MINIO_SECRET_KEY:-contexta123}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_OBS_LOG_LEVEL: warn
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:9000/minio/health/live || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [contexta]

  createbuckets:
    image: python:3.12-slim
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY:-contexta}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY:-contexta123}
      S3_BUCKET: ${MINIO_BUCKET:-contexta}
    entrypoint: ["/bin/sh", "-c"]
    command:
      [
        "pip install --quiet --no-cache-dir --break-system-packages boto3==1.35.90 && python /scripts/createbuckets.py",
      ]
    volumes:
      - ./infra/minio:/scripts:ro
    restart: "no"
    networks: [contexta]

  api:
    profiles: ["app"]
    build:
      context: ./backend
      target: api
    <<: *restart
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-contexta}:${POSTGRES_PASSWORD:-contexta}@postgres:5432/${POSTGRES_DB:-contexta}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: http://minio:9000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini:ro
      - modelcache:/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [contexta]

  worker:
    profiles: ["app"]
    build:
      context: ./backend
      target: worker
    <<: *restart
    command: ["arq", "app.workers.tasks.WorkerSettings"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-contexta}:${POSTGRES_PASSWORD:-contexta}@postgres:5432/${POSTGRES_DB:-contexta}
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      MINIO_ENDPOINT: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - modelcache:/models
    healthcheck:
      test: ["CMD-SHELL", "arq --help >/dev/null 2>&1 || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [contexta]

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_PROJECT_ID: ${NEXT_PUBLIC_PROJECT_ID:-00000000-0000-0000-0000-000000000000}
    <<: *restart
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_PROJECT_ID: ${NEXT_PUBLIC_PROJECT_ID:-00000000-0000-0000-0000-000000000000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    networks: [contexta]

volumes:
  pgdata:
  redisdata:
  qdrantdata:
  miniodata:
  modelcache:

networks:
  contexta:
    driver: bridge
