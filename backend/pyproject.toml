[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "C4", "RUF"]
ignore = [
    "B008",    # FastAPI Depends() in defaults is idiomatic
    "RUF001",  # allow unicode punctuation inside prompts/strings
    "RUF002",
    "RUF003",
    "SIM108",  # ternary is not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions"]

[[tool.mypy.overrides]]
# These ship without py.typed markers, so mypy cannot introspect them.
module = [
    "flashrank",
    "flashrank.*",
    "fastembed",
    "fastembed.*",
    "pymupdf",
    "pymupdf.*",
    "pymupdf4llm",
    "pymupdf4llm.*",
    "pymupdf_layout",
    "pymupdf_layout.*",
    "qdrant_client",
    "qdrant_client.*",
    "edge_tts",
    "edge_tts.*",
    "arq",
    "arq.*",
    "aioboto3",
    "aioboto3.*",
    "aiobotocore",
    "aiobotocore.*",
    "botocore",
    "botocore.*",
    "boto3",
    "boto3.*",
    "langgraph",
    "langgraph.*",
    "langchain_core",
    "langchain_core.*",
    "s3transfer",
    "s3transfer.*",
    "onnxruntime",
    "onnxruntime.*",
]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
skip_empty = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]